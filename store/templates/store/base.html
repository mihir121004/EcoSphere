{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EcoSphere - Sustainable Shopping for a Better Tomorrow. Discover eco-friendly products made from recycled, organic, and sustainable materials.">
    <meta name="keywords" content="eco-friendly, sustainable, organic, recycled, green shopping, eco-commerce">
    <meta name="author" content="EcoSphere">
    <title>{% block title %}EcoSphere - Sustainable Shopping{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block css %}{% endblock %}
</head>
<body>
    {% include 'store/navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'store/footer.html' %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>

    {% block scripts %}{% endblock %}

    <!-- CSRF Token Helper -->
    <script>
        function getCSRFToken() {
            const tokenInput = document.querySelector('input[name=csrfmiddlewaretoken]');
            return tokenInput ? tokenInput.value : '';
        }
    </script>
</body>
</html>
