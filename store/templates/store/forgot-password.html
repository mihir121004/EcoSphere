<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | EchoSphere</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/login.css">
    
</head>
<body class="bg-light">
    

    <!--navbar -->
    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <a href="index.html" class="navbar-brand fw-bold text-success">EcoSphere</a>
        </div>
    </nav>


    <!--forgot password UI-->
    <section class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-lg border-0 rounded-3 p-4" style="max-width: 420px; width: 100%;">

            <div class="text-center mb-4">
                <div class="fs-1">🔐</div>
                <h4 class="fw-bold mt-2">Forgot your password?</h4>
                <p class="text-muted small">
                    No worries! Enter your registered email and we'll send you a reset link.
                </p>
            </div>

        <form action="">
            <div class="mb-3">
                <label for="" class="form-label">Email address</label>
                <input type="email" class="form-control form-control-lg" placeholder="you@ecospherestore.com" required>
            </div>

            <button class="btn btn-success w-100 btn-lg">
                Send Reset Link
            </button>

            <div class="alert alert-success mt-3 text-center">
                If this email exists, a password reset link has been sent.
            </div>

        </form>


        <div class="text-center mt-4">
            <a href="login.html" class="text-success fw-semibold text-decoration-none">
                ← Back to Login
            </a>
        </div>
            
        </div>
    </section>


</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</html>
