{% load static %}

<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
        <!-- Logo -->
        <a href="{% url 'home' %}" class="navbar-brand d-flex align-items-center">
            <i class="bi bi-tree-fill text-success me-2 fs-4"></i>
            <span class="fw-bold">EcoSphere</span>
        </a>

        <!-- Mobile Toggle -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navigation Links -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a href="{% url 'home' %}" class="nav-link px-3">Home</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'shop' %}" class="nav-link px-3">Shop</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'categories' %}" class="nav-link px-3">Categories</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'about' %}" class="nav-link px-3">About</a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'contact' %}" class="nav-link px-3">Contact</a>
                </li>
            </ul>

            <!-- User Actions -->
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <!-- User Greeting -->
                    <div class="dropdown me-3">
                        <button class="btn btn-link text-decoration-none dropdown-toggle d-flex align-items-center" type="button" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle fs-5 me-2"></i>
                            <span class="d-none d-md-inline">{{ user.username }}</span>
                        </button>
                        <ul class="dropdown-menu" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" href="{% url 'profile' %}"><i class="bi bi-person me-2"></i>Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form action="{% url 'logout' %}" method="POST" class="d-inline">
                                    {% csrf_token %}
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>

                    <!-- Cart -->
                    <a href="{% url 'cart' %}" class="btn btn-success position-relative me-2">
                        <i class="bi bi-cart3"></i>
                        <span class="d-none d-md-inline ms-2">Cart</span>
                        {% if user.cart.items.exists %}
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                {{ user.cart.items.count }}
                                <span class="visually-hidden">items in cart</span>
                            </span>
                        {% endif %}
                    </a>
                {% else %}
                    <!-- Login/Register -->
                    <a href="{% url 'login' %}" class="btn btn-outline-success me-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i>
                        Login
                    </a>
                    <a href="{% url 'cart' %}" class="btn btn-success">
                        <i class="bi bi-cart3 me-1"></i>
                        Cart
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>
